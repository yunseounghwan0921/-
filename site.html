<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 버튼 점수 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center-wrap">
        <div style="margin-bottom:20px;">
            <button class="timer-btn" onclick="startGame(5)">5초</button>
            <button class="timer-btn" onclick="startGame(10)">10초</button>
            <button class="timer-btn" onclick="startGame(20)">20초</button>
            <button class="timer-btn" onclick="startGame(30)">30초</button>
        </div>
        <button id="myButton" onclick="moveButton()" style="display:none;">
            <img src="스크린샷 2025-08-02 010105.png" alt="버튼" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">
        </button>
        <div id="final-score" style="margin-top:30px; font-size:1.3em; font-weight:bold;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
